<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victor Kutz - Fotos</title>
  <style>
    /* Base styles */
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      color: rgb(255, 255, 255);
      background-color: rgb(0, 0, 0);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(23, 23, 23, 0.7);
      z-index: -1;
    }

    /* Header styles */
    header {
      margin-bottom: 20px;
      padding: 15px;
      backdrop-filter: blur(3px);
      background-color: rgb(0, 0, 0);
      -webkit-backdrop-filter: blur(6px);
      position: relative;
    }

    .header-top {
      font-size: 20px;
      margin-bottom: 10px;
      text-align: center;
    }

    .header-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-links a {
      font-size: 16px;
      color: blue;
      text-decoration: none;
      padding: 5px 10px;
    }

    .header-links a:hover {
      opacity: 0.7;
    }

    a:link,
    a:visited,
    a:hover,
    a:active {
      color: blue;
      text-decoration: none;
    }

    /* Container and layout */
    #container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
    }

    /* Gallery styles */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      background: rgba(20, 20, 20, 0.95);
      padding: 15px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
      max-width: 95%;
      max-height: 85%;
      animation: zoomIn 0.5s ease;
      position: relative;
      border-radius: 5px;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 0;
    }

    .modal-info {
      margin-top: 15px;
      color: #e0e0e0;
      text-align: center;
      font-size: 14px;
    }

    .modal-close {
      position: absolute;
      top: 5px;
      right: 10px;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      z-index: 25;
    }

    .modal-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 30px;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      border: none;
      cursor: pointer;
      padding: 8px 12px;
      user-select: none;
      transition: background 0.3s ease;
      z-index: 20;
      border-radius: 50%;
    }

    .modal-arrow:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    .modal-arrow.left {
      left: 5px;
    }

    .modal-arrow.right {
      right: 5px;
    }

    @keyframes zoomIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes zoomOut {
      from {
        transform: scale(1);
        opacity: 1;
      }
      to {
        transform: scale(0.8);
        opacity: 0;
      }
    }

    /* Mobile menu for small screens */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      position: absolute;
      top: 15px;
      right: 15px;
    }

    /* Loading animation for images */
    .gallery img {
      background: #222;
      min-height: 150px;
    }

    /* Media queries for responsiveness */
    @media (min-width: 768px) {
      header {
        padding: 20px;
      }
      
      .header-top {
        font-size: 24px;
        text-align: left;
      }
      
      .header-links {
        justify-content: flex-start;
      }
      
      .gallery {
        grid-template-columns: repeat(3, 1fr); /* 3 columns on tablets and desktops */
        gap: 10px;
      }
      
      .modal-content {
        flex-direction: row;
        max-width: 90%;
        max-height: 90%;
        padding: 20px;
      }
      
      .modal-content img {
        max-width: 60vw;
        max-height: 80vh;
      }
      
      .modal-info {
        margin-left: 20px;
        margin-top: 0;
        text-align: left;
        max-width: 30vw;
      }
      
      .modal-arrow {
        font-size: 40px;
        padding: 10px;
      }
      
      .modal-arrow.left {
        left: 10px;
      }
      
      .modal-arrow.right {
        right: 10px;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
      }
      
      .header-links {
        flex-direction: column;
        align-items: center;
      }
      
      .modal-arrow {
        font-size: 24px;
        padding: 6px 10px;
      }
    }

    /* Back to top button */
    .back-to-top {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 99;
      border: none;
      outline: none;
      background-color: rgba(0, 0, 255, 0.7);
      color: white;
      cursor: pointer;
      padding: 10px 15px;
      border-radius: 50%;
      font-size: 18px;
    }

    .back-to-top:hover {
      background-color: rgba(0, 0, 255, 0.9);
    }
  </style>
</head>

<body>

  <!-- Back to top button -->
  <button class="back-to-top" id="backToTop">↑</button>

  <!-- Modal -->
  <div id="myModal" class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <button class="modal-arrow left" id="modal-prev">&#10094;</button>
    <button class="modal-arrow right" id="modal-next">&#10095;</button>

    <div class="modal-content">
      <img id="modal-img" src="" alt="">
    </div>
  </div>

  <script>
    // Mobile menu
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const headerLinks = document.getElementById('header-links');

    function checkScreenSize() {
      if (window.innerWidth < 768) {
        mobileMenuBtn.style.display = 'block';
        headerLinks.style.display = 'none';
      } else {
        mobileMenuBtn.style.display = 'none';
        headerLinks.style.display = 'flex';
      }
    }

    checkScreenSize();

    window.addEventListener('resize', checkScreenSize);

    mobileMenuBtn.addEventListener('click', function () {
      if (headerLinks.style.display === 'flex') {
        headerLinks.style.display = 'none';
      } else {
        headerLinks.style.display = 'flex';
        headerLinks.style.flexDirection = 'column';
      }
    });

    // Modal da galeria
    const galleryImages = document.querySelectorAll('.gallery img');
    const modal = document.getElementById('myModal');
    const modalImg = document.getElementById('modal-img');
    const modalClose = document.getElementById('modal-close');
    const modalPrev = document.getElementById('modal-prev');
    const modalNext = document.getElementById('modal-next');

    const photos = [
'/novasfotos/1.jpg'
'/novasfotos/2.jpg'
'/novasfotos/3.jpg'
'/novasfotos/4.jpg'
'/novasfotos/5.jpg'
'/novasfotos/6.jpg'
'/novasfotos/7.jpg'
'/novasfotos/8.jpg'
'/novasfotos/9.jpg'
'/novasfotos/10.jpg'
'/novasfotos/11.jpg'
'/novasfotos/12.jpg'
'/novasfotos/13.jpg'
'/novasfotos/14.jpg'
'/novasfotos/15.jpg'
'/novasfotos/16.jpg'
'/novasfotos/17.jpg'
'/novasfotos/18.jpg'
'/novasfotos/19.jpg'
'/novasfotos/20.jpg'
'/novasfotos/21.jpg'
'/novasfotos/22.jpg'
'/novasfotos/23.jpg'
'/novasfotos/24.jpg'
'/novasfotos/25.jpg'
'/novasfotos/26.jpg'
'/novasfotos/27.jpg'
'/novasfotos/28.jpg'
'/novasfotos/29.jpg'
'/novasfotos/30.jpg'
'/novasfotos/31.jpg'
'/novasfotos/32.jpg'
'/novasfotos/33.jpg'
'/novasfotos/34.jpg'
'/novasfotos/35.jpg'
'/novasfotos/36.jpg'
'/novasfotos/37.jpg'
'/novasfotos/38.jpg'
'/novasfotos/39.jpg'
    ];

    let currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      modalImg.src = photos[index];
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + photos.length) % photos.length;
      modalImg.src = photos[currentIndex];
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % photos.length;
      modalImg.src = photos[currentIndex];
    }

    galleryImages.forEach((img, index) => {
      img.addEventListener('click', () => openModal(index));
    });

    modalClose.addEventListener('click', closeModal);

    modalPrev.addEventListener('click', function (e) {
      e.stopPropagation();
      prevImage();
    });

    modalNext.addEventListener('click', function (e) {
      e.stopPropagation();
      nextImage();
    });

    modal.addEventListener('click', function (e) {
      if (e.target === modal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === "Escape") closeModal();
      if (e.key === "ArrowLeft") prevImage();
      if (e.key === "ArrowRight") nextImage();
    });

    // Texto animado
    document.querySelectorAll('.animated-text').forEach(el => {
      el.innerHTML = el.textContent.split('').map(char => {
        if (char === ' ') {
          return ' ';
        }
        return `<span>${char}</span>`;
      }).join('');
    });
  </script>
